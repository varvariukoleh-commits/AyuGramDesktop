name: Windows Build
on:
  push:
    branches: [dev]
  workflow_dispatch:
jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
    defaults:
      run:
        shell: cmd
    steps:
      - name: Free disk space
        shell: powershell
        run: |
          Remove-Item -Path "C:\ghcup" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\cabal" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\mingw64" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\tools\julia" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\tools\kotlinc" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\LLVM" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files (x86)\LLVM" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\ImageMagick-7.1.2-Q16-HDRI" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Microsoft SQL Server" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files (x86)\Microsoft SQL Server" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\MongoDB" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files (x86)\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Strawberry" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\local" -Recurse -Force -ErrorAction SilentlyContinue
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{N='Free(GB)';E={[math]::Round($_.Free/1GB,1)}}, @{N='Used(GB)';E={[math]::Round($_.Used/1GB,1)}}

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\AyuGramDesktop

      - name: Compute cache key
        shell: bash
        run: |
          echo "$(sha256sum $TBUILD/AyuGramDesktop/$PREPARE_PATH | awk '{ print $1 }')" > CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Setup MSVC x64
        with:
          arch: x64

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Cache ThirdParty
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win-x64-thirdparty-${{ env.CACHE_KEY }}
          restore-keys: win-x64-thirdparty-

      - name: Cache Libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\Qt*
          key: win-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: win-x64-libs-

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ env.LibrariesPath }}\Qt*
          key: win-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: win-x64-qt6-

      - name: Build dependencies
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          %TBUILD%\AyuGramDesktop\Telegram\build\prepare\win.bat skip-release silent qt6

      - name: Configure
        run: |
          cd %TBUILD%\AyuGramDesktop\Telegram
          call configure.bat ^
            qt6 ^
            x64 ^
            -D TDESKTOP_API_TEST=ON ^
            -D CMAKE_CONFIGURATION_TYPES=Debug ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Build Telegram
        run: cmake --build %TBUILD%\AyuGramDesktop\out --config Debug --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64-Debug
          path: |
            ${{ env.TBUILD }}\AyuGramDesktop\out\Debug\Telegram.exe
            ${{ env.TBUILD }}\AyuGramDesktop\out\Debug\Updater.exe
